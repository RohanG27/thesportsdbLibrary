name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch TheSportsDB API changes with the live tests
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Offline tests against recorded responses, the public-API (ABI) check, and the docs build.
      - run: ./gradlew build dokkaGenerate
      - name: Check the generated Java facade is up to date
        run: |
          python3 tools/gen-futures.py
          git diff --exit-code src/main/kotlin/sportsdb/SportsDbFutures.kt

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # Offline tests (recorded responses), strict typing, lint; test_generated checks _sync/ is current.
      - run: pytest
      - run: mypy
      - run: ruff check src tests tools
      - name: Fixtures match the Kotlin project's recordings
        run: |
          python tools/sync_fixtures.py
          git diff --exit-code -- tests/fixtures

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.2", "8.5"]
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          tools: composer
      - run: composer install --no-interaction --no-progress
      # Offline tests (recorded responses); GeneratedTest checks src/Model matches the Kotlin models (uses python3).
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress
      - name: Fixtures match the Kotlin project's recordings
        run: |
          php tools/sync_fixtures.php
          git diff --exit-code -- tests/fixtures

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      # Offline tests (recorded responses); generated.test.ts checks src/models.ts matches the Kotlin models.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fixtures match the Kotlin project's recordings
        run: |
          npm run sync-fixtures
          git diff --exit-code -- test/fixtures

  javascript-node18:
    # The library supports Node 18+, older than Vitest supports: build on 24, run the built package on 18.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install && npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: node test/smoke-node18.mjs

  graphql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      # The schema is valid, up to date with the models/glossary, fully documented, every @source matches
      # the OpenAPI specs, and the README's example queries validate and run.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml openapi-spec-validator markdown
      - name: Specs are up to date with the fixtures and glossary
        run: |
          python tools/build_openapi.py
          git diff --exit-code -- openapi
      - run: python -m openapi_spec_validator openapi/v1.yaml openapi/v2.yaml
      - run: npx -y @redocly/cli@latest lint openapi/v1.yaml openapi/v2.yaml
      - run: python tools/build_site.py

  live:
    # Calls the real API. Uses the free key unless the THESPORTSDB_API_KEY secret is set (then v2 too).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew liveTest
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]' && pytest -m live
        working-directory: python
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer
      - run: composer install --no-interaction --no-progress && vendor/bin/phpunit --group live
        working-directory: php
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install && npm run test:live && npm run build
        working-directory: javascript
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: node test/smoke-node18.mjs   # the built package on Node 18, including real API calls
        working-directory: javascript
        env:
          LIVE: "1"
