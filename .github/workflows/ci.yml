name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch TheSportsDB API changes with the live tests
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Offline tests against recorded responses, the public-API (ABI) check, and the docs build.
      - run: ./gradlew build dokkaGenerate
      - name: Check the generated Java facade is up to date
        run: |
          python3 tools/gen-futures.py
          git diff --exit-code src/main/kotlin/sportsdb/SportsDbFutures.kt

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # Offline tests (recorded responses), strict typing, lint; test_generated checks _sync/ is current.
      - run: pytest
      - run: mypy
      - run: ruff check src tests tools
      - name: Fixtures match the Kotlin project's recordings
        run: |
          python tools/sync_fixtures.py
          git diff --exit-code -- tests/fixtures

  live:
    # Calls the real API. Uses the free key unless the THESPORTSDB_API_KEY secret is set (then v2 too).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew liveTest
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]' && pytest -m live
        working-directory: python
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
