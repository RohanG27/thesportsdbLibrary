name: Docs site

# Builds docs-site/ (guides, field glossary, Redoc references) plus each client library's API
# reference (Dokka, pdoc, phpDocumentor, TypeDoc) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "kotlin/src/main/**"
      - "kotlin/docs/**"
      - "python/src/**"
      - "php/src/**"
      - "javascript/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      - run: pip install pyyaml markdown pdoc -e ../python
      - run: python tools/build_site.py
      - run: tools/build_api_docs.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
