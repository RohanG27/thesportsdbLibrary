# Publishes the Kotlin library to Maven Central when a tag like kotlin/v0.1.0 is pushed.
# Secrets: MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (a Central Portal user token),
# MAVEN_SIGNING_KEY (ASCII-armored private key) and MAVEN_SIGNING_KEY_PASSWORD.
name: Release Kotlin

on:
  push:
    tags: ["kotlin/v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, then publish and release to Maven Central
        run: ./gradlew build publishToMavenCentral -PreleaseVersion="${GITHUB_REF_NAME#kotlin/v}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
