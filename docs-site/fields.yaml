strBadge:
  default: 'Badge image URL.'
  Season: 'Badge for this season.'
strLogo:
  default: 'Logo image URL.'
  TvListing: 'The channel''s logo.'
strBanner: 'Banner image URL (wide).'
strPoster: 'Poster image URL (tall).'
strThumb:
  default: 'Thumbnail image URL.'
  Player: 'Photo of the player.'
  Event: 'Thumbnail for the event.'
strSquare: 'Square image URL.'
strFanart: 'Fan art image URL.'
strCutout: 'Transparent head-and-shoulders image of the player.'
strRender: 'Transparent full-body image of the player.'
strCartoon: 'Cartoon image of the player.'
strTrophy: 'Image of the league''s trophy.'
strEquipment:
  default: 'Kit image URL.'
  Team: 'The team''s current kit image.'
strTeamBadge: 'Badge of the team.'
strHomeTeamBadge: 'Home team''s badge.'
strAwayTeamBadge: 'Away team''s badge.'
strLeagueBadge: 'The league''s badge.'
strHonourLogo: 'Logo of the honour.'
strHonourTrophy: 'Image of the honour''s trophy.'
strMilestoneLogo: 'Logo of the milestone.'
strEventThumb: 'Thumbnail for the event.'
strEventPoster: 'Poster for the event.'
strEventBanner: 'Banner for the event.'
strEventSquare: 'Square image for the event.'
strSportThumb: 'Image for the sport.'
strSportThumbBW: 'Black-and-white image for the sport.'
strSportIconGreen: 'Green icon for the sport.'
flag_url_16: '16 px flag image URL.'
flag_url_32: '32 px flag image URL.'
flag_url_64: '64 px flag image URL.'
strVideo: 'Highlights video URL, usually YouTube.'
strTweet1: 'A tweet about the event.'

# --- Links ----------------------------------------------------------------------------------
strWebsite: 'Website, often without a scheme (`www.arsenal.com`).'
strFacebook: 'Facebook page, often without a scheme.'
strTwitter: 'Twitter/X profile, often without a scheme.'
strInstagram: 'Instagram profile, often without a scheme.'
strYoutube: 'YouTube channel, often without a scheme.'
strRSS: 'RSS feed URL.'
