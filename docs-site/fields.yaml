# Field glossary for TheSportsDB records. Used by tools/build_openapi.py and the "Fields" guide.
#
# Each entry is either a description, or a map of record type -> description with a "default".
# Every value in a record is a string or null; "" also means "no value". Formats below describe
# the text. Patterns (strDescriptionXX, strFanart1-4, strColour1-3, idLeague2-7/strLeague2-7) are
# described by rules in the generator.

# --- Identifiers ------------------------------------------------------------------------------
id:
  default: 'This record''s id.'
  Honour: 'Id of this player''s honour record (see `idHonour` for the honour itself).'
  FormerTeam: 'Id of this former-team record.'
  Milestone: 'Id of this milestone record.'
  Contract: 'Id of this contract record.'
  PlayerStat: 'Id of this statistic record.'
  TvListing: 'Id of this TV listing.'
idSport: 'Sport id.'
idLeague:
  default: 'League id.'
  Team: 'Id of the team''s main league. Other competitions are in `idLeague2`–`idLeague7`.'
idTeam:
  default: 'Team id.'
  Player: 'Id of the player''s current team (club).'
  Equipment: 'Id of the team the kit belongs to.'
idPlayer: 'Player id.'
idEvent: 'Event id.'
idVenue:
  default: 'Venue id.'
  Team: 'Id of the team''s home venue.'
idChannel: 'TV channel id. Use it with `eventstv.php?id=` (v1) or `filter/tv/channelid/{id}` (v2).'
idHomeTeam: 'Home team id.'
idAwayTeam: 'Away team id.'
idHonour: 'Id of the honour (trophy or award) itself, shared by everyone who won it.'
idMilestone: 'Id of the milestone type.'
idFormerTeam: 'Team id of the former team.'
idResult: 'Id of this result record.'
idLineup: 'Id of this lineup record.'
idTimeline: 'Id of this timeline entry.'
idStanding: 'Id of this table row.'
idStatistic: 'Id of this statistic.'
idEquipment: 'Id of this kit record.'
idLiveScore: 'Id of this live-score record.'
idAssist: 'Player id of the assisting player.'
idTeam2: 'Id of the player''s second team, often a national team.'
idTeamNational: 'Id of the player''s national team.'
idPlayerManager: 'Id of this person''s record as a manager, when they also have one.'
idCup: '`1` for a cup competition, `0` for a league.'
idDupe: 'Set when this venue duplicates another record; the id of the original.'
idAPIfootball: 'Id of the same record in API-Football.'
idAPIfootballv3: 'Id of the same league in API-Football v3.'
idApiFootball: 'Id of the same record in API-Football (note the different capitalisation on this record type).'
idESPN: 'Id of the same record at ESPN.'
idGoogle: 'Google Knowledge Graph id, e.g. `/g/11cpprmr81`.'
idTransferMkt: 'Transfermarkt id.'
idWikidata: 'Wikidata id, e.g. `Q9144353`.'
intSoccerXMLTeamID: 'Id in the SoccerXML feed.'

# --- Names and text ---------------------------------------------------------------------------
strSport: 'Sport name, e.g. `Soccer`, `Ice Hockey`. Use this spelling for sport filters.'
strLeague:
  default: 'League name.'
  Team: 'Name of the team''s main league.'
strLeagueAlternate: 'Other names for the league, comma-separated.'
strTeam:
  default: 'Team name.'
  Player: 'Name of the player''s current team.'
strTeamShort: 'Short code, e.g. `ARS`.'
strTeamAlternate: 'Other names for the team, comma-separated, e.g. `Arsenal Football Club, AFC, Arsenal FC`.'
strKeywords: 'Nicknames and keywords, comma-separated, e.g. `Gunners, Gooners`.'
strTeam2: 'Name of the player''s second team, often a national team.'
strPlayer: 'Player name.'
strPlayerAlternate: 'The player''s full or alternate name.'
strLastName: 'The player''s last name.'
strEvent: 'Event name, usually `Home vs Away`.'
strEventAlternate: 'Alternate event name, usually `Away @ Home`.'
strFilename: '`{League} {YYYY-MM-DD} {Home} vs {Away}`: searchable with `searchfilename.php`.'
strVenue:
  default: 'Venue name.'
strVenueAlternate: 'Alternate venue name.'
strVenueSponsor: 'Sponsored name of the venue.'
strStadium: 'Name of the team''s home stadium.'
strHomeTeam: 'Home team name.'
strAwayTeam: 'Away team name.'
strChannel: 'TV channel name, e.g. `TSN 1`.'
strHonour: 'Name of the honour, e.g. `Copa Libertadores`.'
strMilestone: 'Name of the milestone or award.'
strFormerTeam: 'Name of the former team.'
strStatistic: 'Name of the statistic, e.g. `Goals`, `Appearances`, `Mins Played`.'
strStat: 'Name of the team statistic, e.g. `Shots on Goal`, `Ball Possession`.'
name_en: 'Country name in English. Use this spelling for country filters.'
name_fr: 'Country name in French.'
code: 'Two-letter country code, e.g. `AD`.'
strSeason: 'Season name, e.g. `2026-2027`, or `2026` for single-year leagues.'
strCurrentSeason: 'The league''s current season name. Pass it to the season endpoints.'
strNaming: 'Template for event names, e.g. `{strHomeTeam} vs {strAwayTeam}`.'
strFormat: '`TeamvsTeam` (two sides) or `EventSport` (a field of competitors, e.g. motorsport, golf).'
strSportDescription: 'Description of the sport, in English.'
strDescription:
  default: 'Description.'
  Standing: 'What finishing in this position leads to, e.g. `Promotion - Champions League (League phase)`.'
strDetail: 'Extra result detail, e.g. a time gap such as `+29.520`.'
strResult:
  default: 'Result as free text; can contain HTML (`<br>`).'
strComment: 'Commentary for this timeline entry.'
strTimeline: 'Kind of timeline entry, e.g. `Goal`, `Card`, `subst`.'
strTimelineDetail: 'Detail of the entry, e.g. `Yellow Card`, `Normal Goal`, or the player coming on.'
strAssist: 'Name of the assisting player.'
strUsername: 'TheSportsDB user who uploaded the record.'
Message: 'A message instead of data, e.g. `No data found` or `Invalid Premium API key: ...`.'

# --- Places, people -------------------------------------------------------------------------
strCountry:
  default: 'Country.'
  TvListing: 'Country of the TV channel.'
  Event: 'Country where the event takes place.'
strEventCountry: 'Country where the event takes place.'
strCity: 'City where the event takes place.'
strLocation: 'Location, e.g. `Holloway, London, England`.'
strNationality: 'The player''s nationality.'
strBirthLocation: 'Place of birth.'
strDeathLocation: 'Place of death.'
strTimezone: 'The venue''s time zone as text, e.g. `UTC +00:00 Greenwich Mean Time (GMT)`.'
strMap: 'Either coordinates as `latitude, longitude`, or a map image URL.'
strArchitect: 'The venue''s architect.'
strCost: 'Construction cost, as text.'
strGender: '`Male` or `Female`.'
strPosition: 'Playing position, e.g. `Goalkeeper`, `Centre-Forward`.'
strPositionShort: 'Short position code (often null).'
strNumber: 'Shirt number, as text.'
strStatus:
  default: 'Status code, e.g. `NS` (not started), `1H`, `HT`, `2H`, `FT`, `Q3`, `P2`, `PST` (postponed). Older events often have none.'
  Player: 'The player''s status, e.g. `Active`, `Retired`.'
strHeight: 'Height as text, in mixed units, e.g. `1.82 m (6 ft 0 in)` or `186 cm`.'
strWeight: 'Weight as text, in mixed units, e.g. `78 kg` or `161 lbs`.'
strSide: 'Preferred foot or hand, `Left` or `Right`.'
strEthnicity: 'Ethnicity, as given by contributors.'
strCollege: 'College attended.'
strAgent: 'The player''s agent.'
strWage: 'Wage, as text with currency, e.g. `£5,200,000`.'
strSigning: 'Transfer fee, as text, e.g. `£25.20m` or `Youth`.'
strKit: 'Boot or equipment model the player wears.'
strOutfitter: 'Kit outfitter.'
strOfficial: 'The referee or main official.'
strWeather: 'Weather at the event.'
strType: 'Kit type, e.g. `1st`, `2nd`, `GK`.'
strDivision: 'The team''s division, as text.'
strGroup: 'Group or conference within a competition.'
strMoveType: 'How the player moved, e.g. `Permanent`, `Loan`.'
strJoined: 'When the player joined, usually a year.'
strDeparted: 'When the player left, usually a year.'
strYearStart: 'Contract start year.'
strYearEnd: 'Contract end year.'
strForm: 'Recent results, newest last, e.g. `WWDLW`.'
strTvRights: 'Broadcasting rights holders, as free text.'
strPeriod: 'Period of play.'
strProgress: 'Progress of a live game, e.g. the minute, or `Final`.'
strFormation: 'Team formation, e.g. `4-3-3` (often null).'

# --- Numbers --------------------------------------------------------------------------------
intRank: 'Position in the table.'
intPlayed: 'Games played.'
intWin: 'Games won.'
intDraw: 'Games drawn.'
intLoss: 'Games lost.'
intGoalsFor: 'Goals scored.'
intGoalsAgainst: 'Goals conceded.'
intGoalDifference: 'Goal difference.'
intPoints:
  default: 'Points.'
intPosition: 'Finishing position.'
intHomeScore: 'Home score. Null until the event has a score.'
intAwayScore: 'Away score. Null until the event has a score.'
intHomeScoreExtra: 'Home score in extra time or a shoot-out.'
intAwayScoreExtra: 'Away score in extra time or a shoot-out.'
intHome: 'The statistic for the home side.'
intAway: 'The statistic for the away side.'
intRound: 'Round or matchday number.'
intSpectators: 'Attendance.'
intScore: 'Users'' rating of the event.'
intScoreVotes: 'Number of ratings.'
intCapacity: 'Venue capacity.'
intFormedYear: 'Year founded. `0` means unknown.'
intDivision:
  default: 'Division level; `1` is a top flight. Cups often use `0` or `99`.'
intLoved: 'Number of users who marked this as a favourite.'
intSquadNumber: 'Squad number.'
intTime: 'Minute of the timeline entry.'
intAppearances: 'Appearances for the team.'
intGoals: 'Goals for the team.'
relevance: 'Search relevance score (`searchplayers.php` only).'
strValue: 'Value of the statistic, as text.'

# --- Dates and times ------------------------------------------------------------------------
dateEvent: 'Date of the event, `YYYY-MM-DD`, in **UTC**.'
dateEventLocal: 'Date of the event at the venue, `YYYY-MM-DD`. Often missing for future events.'
strTime: 'Start time, `HH:MM:SS`, in **UTC**.'
strTimeLocal: 'Start time at the venue, `HH:MM:SS`. Often missing for future events.'
strTimestamp: 'Start, `YYYY-MM-DDTHH:MM:SS`, in **UTC** (no zone in the text).'
strTimeStamp: 'Broadcast start, `YYYY-MM-DD HH:MM:SS` (note the space and the capital S), in **UTC**.'
strEventTime: 'Kick-off time, `HH:MM`.'
dateBorn: 'Date of birth, `YYYY-MM-DD`.'
dateDied: 'Date of death, `YYYY-MM-DD`.'
dateSigned: 'Date the player signed for the current team.'
dateFirstEvent: 'Date of the league''s first recorded event.'
dateMilestone: 'Date of the milestone.'
dateUpdated: 'When the table row was last updated, `YYYY-MM-DD HH:MM:SS` (zone not stated).'
updated: 'When the live score was last refreshed, `YYYY-MM-DD HH:MM:SS` (zone not stated). Old values mean a stale entry.'
date: 'When the kit was added, `YYYY-MM-DD HH:MM:SS` (zone not stated).'

# --- Flags ----------------------------------------------------------------------------------
strPostponed: '`yes` or `no`.'
strHome: '`Yes` for the home side, `No` for the away side.'
strSubstitute: '`Yes` for a substitute, `No` for a starter.'
strComplete: 'Whether TheSportsDB considers the league''s data complete (`yes`/`No`).'
strLocked: '`locked` or `unlocked`: whether the record is protected from edits.'
strCreativeCommons: 'Whether the artwork is Creative Commons (`Yes`/`No`/`NO`). Artwork that isn''t may not be used in published apps.'
strCreativeCommonsAttribution: 'Credit line to show with Creative Commons artwork.'

