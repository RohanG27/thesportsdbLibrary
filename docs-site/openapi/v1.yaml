          type:
          - string
          - 'null'
          description: Kind of timeline entry, e.g. `Goal`, `Card`, `subst`.
          examples:
          - Card
        strTimelineDetail:
          type:
          - string
          - 'null'
          description: Detail of the entry, e.g. `Yellow Card`, `Normal Goal`, or the player coming on.
          examples:
          - Yellow Card
    TvListing:
      type: object
      description: TvListing record. Every value is a string or null; `""` also means no value.
      properties:
        dateEvent:
          type:
          - string
          - 'null'
          description: Date of the event, `YYYY-MM-DD`, in **UTC**.
          examples:
          - '2026-10-10'
        id:
          type:
          - string
          - 'null'
          description: Id of this TV listing.
          examples:
          - '1218715'
        idChannel:
          type:
          - string
          - 'null'
          description: TV channel id. Use it with `eventstv.php?id=` (v1) or `filter/tv/channelid/{id}` (v2).
          examples:
          - '582'
        idEvent:
          type:
          - string
          - 'null'
          description: Event id.
          examples:
          - '2494052'
        intDivision:
          type:
          - string
          - 'null'
          description: Division level; `1` is a top flight. Cups often use `0` or `99`.
          examples:
          - '0'
        strChannel:
          type:
          - string
          - 'null'
          description: TV channel name, e.g. `TSN 1`.
          examples:
          - Disney+ Hotstar
        strCountry:
          type:
          - string
          - 'null'
          description: Country of the TV channel.
          examples:
          - India
        strEvent:
          type:
          - string
          - 'null'
          description: Event name, usually `Home vs Away`.
          examples:
          - Arsenal vs Leeds United
        strEventBanner:
          type:
          - string
          - 'null'
          description: Banner for the event.
          examples:
          - https://r2.thesportsdb.com/images/media/event/banner/h61dc61784549908.jpg
        strEventCountry:
          type:
          - string
          - 'null'
          description: Country where the event takes place.
          examples:
          - England
        strEventPoster:
          type:
          - string
          - 'null'
          description: Poster for the event.
          examples:
          - https://r2.thesportsdb.com/images/media/event/poster/ekc9q71784549630.jpg
        strEventSquare:
          type:
          - string
          - 'null'
          description: Square image for the event.
          examples:
          - https://r2.thesportsdb.com/images/media/event/square/kzqbsy1784550175.jpg
        strEventThumb:
          type:
          - string
          - 'null'
          description: Thumbnail for the event.
          examples:
          - https://r2.thesportsdb.com/images/media/event/thumb/mayo9h1784549326.jpg
        strLogo:
          type:
          - string
          - 'null'
          description: The channel's logo.
          examples:
          - https://r2.thesportsdb.com/images/media/channel/logo/7za33k1683192230.png
        strSeason:
          type:
          - string
          - 'null'
          description: Season name, e.g. `2026-2027`, or `2026` for single-year leagues.
          examples:
          - 2026-2027
        strSport:
          type:
          - string
          - 'null'
          description: Sport name, e.g. `Soccer`, `Ice Hockey`. Use this spelling for sport filters.
          examples:
          - Soccer
        strTime:
          type:
          - string
          - 'null'
          description: Start time, `HH:MM:SS`, in **UTC**.
          examples:
          - '11:30:00'
        strTimeStamp:
          type:
          - string
          - 'null'
          description: Broadcast start, `YYYY-MM-DD HH:MM:SS` (note the space and the capital S), in **UTC**.
          examples:
          - '2026-10-10 11:30:00'
    Venue:
      type: object
      description: Venue record. Every value is a string or null; `""` also means no value.
      properties:
        idDupe:
          type:
          - string
          - 'null'
          description: Set when this venue duplicates another record; the id of the original.
        idVenue:
          type:
          - string
          - 'null'
          description: Venue id.
          examples:
          - '23604'
        intCapacity:
          type:
          - string
          - 'null'
          description: Venue capacity.
          examples:
          - '90000'
        intFormedYear:
          type:
          - string
          - 'null'
          description: Year founded. `0` means unknown.
          examples:
          - '0'
        intLoved:
          type:
          - string
          - 'null'
          description: Number of users who marked this as a favourite.
        strArchitect:
          type:
          - string
          - 'null'
          description: The venue's architect.
        strCost:
          type:
          - string
          - 'null'
          description: Construction cost, as text.
          examples:
          - £789 million
        strCountry:
          type:
          - string
          - 'null'
          description: Country.
          examples:
          - Jamaica
        strCreativeCommons:
          type:
          - string
          - 'null'
          description: Whether the artwork is Creative Commons (`Yes`/`No`/`NO`). Artwork that isn't may not be used in published
            apps.
          examples:
          - 'NO'
        strDescriptionEN:
          type:
          - string
          - 'null'
          description: Description in language `EN`.
          examples:
          - Wembley Stadium (currently known officially as Wembley Stadium connected by EE for commercial sponsorship reasons)
            is an association football stadium in Wemb…
        strFacebook:
          type:
          - string
          - 'null'
          description: Facebook page, often without a scheme.
          examples:
          - www.facebook.com/WembleyStadium
        strFanart1:
          type:
          - string
          - 'null'
          description: Fan art image 1.
          examples:
          - https://r2.thesportsdb.com/images/media/venue/fanart/7tpavy1708696222.jpg
        strFanart2:
          type:
          - string
          - 'null'
          description: Fan art image 2.
          examples:
          - https://r2.thesportsdb.com/images/media/venue/fanart/3zirzg1708696411.jpg
        strFanart3:
          type:
          - string
          - 'null'
          description: Fan art image 3.
          examples:
          - https://r2.thesportsdb.com/images/media/venue/fanart/c482m41708696417.jpg
        strFanart4:
          type:
          - string
          - 'null'
          description: Fan art image 4.
          examples:
          - https://r2.thesportsdb.com/images/media/venue/fanart/ncll4t1708696444.jpg
        strInstagram:
          type:
          - string
          - 'null'
          description: Instagram profile, often without a scheme.
          examples:
          - www.instagram.com/wembleystadium
        strLocation:
          type:
          - string
          - 'null'
          description: Location, e.g. `Holloway, London, England`.
          examples:
          - Hayes, Clarendon, Jamaica
        strLocked:
          type:
          - string
          - 'null'
          description: '`locked` or `unlocked`: whether the record is protected from edits.'
          examples:
          - unlocked
        strLogo:
          type:
          - string
          - 'null'
          description: Logo image URL.
          examples:
          - https://r2.thesportsdb.com/images/media/venue/logo/zowstr1709984100.png
        strMap:
          type:
          - string
          - 'null'
          description: Either coordinates as `latitude, longitude`, or a map image URL.
          examples:
          - 51.555556, -0.279444
        strSport:
          type:
          - string
          - 'null'
          description: Sport name, e.g. `Soccer`, `Ice Hockey`. Use this spelling for sport filters.
          examples:
          - Soccer
        strThumb:
          type:
          - string
          - 'null'
          description: Thumbnail image URL.
          examples:
          - https://r2.thesportsdb.com/images/media/venue/thumb/qttuty1420627847.jpg
        strTimezone:
          type:
          - string
          - 'null'
          description: The venue's time zone as text, e.g. `UTC +00:00 Greenwich Mean Time (GMT)`.
          examples:
          - UTC -05:00 Eastern Standard Time (EST)
        strTwitter:
          type:
          - string
          - 'null'
          description: Twitter/X profile, often without a scheme.
          examples:
          - twitter.com/wembleystadium
        strVenue:
          type:
          - string
          - 'null'
          description: Venue name.
          examples:
          - Wembley Centre of Excellence
        strVenueAlternate:
          type:
          - string
          - 'null'
          description: Alternate venue name.
          examples:
          - Wembley
        strVenueSponsor:
          type:
          - string
          - 'null'
          description: Sponsored name of the venue.
        strWebsite:
          type:
          - string
          - 'null'
          description: Website, often without a scheme (`www.arsenal.com`).
          examples:
          - www.wembleystadium.com
        strYoutube:
          type:
          - string
          - 'null'
          description: YouTube channel, often without a scheme.
    Message:
      type: object
      properties:
        Message:
          type: string
          description: 'A message instead of data, e.g. `No data found` or `Invalid Premium API key: ...`.'
      example:
        Message: 'Invalid Premium API key: Signup here: https://www.thesportsdb.com/pricing'
  responses:
    InvalidKey:
      description: The key isn't accepted (only `123`, `3` and paid keys work).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    RateLimited:
      description: Over the rate limit (30 a minute free, 100 premium, 120 business). Wait a minute.
  parameters:
    apiKey:
      name: apiKey
      in: path
      required: true
      schema:
        type: string
      example: '123'
      description: Your API key. `123` is the free key for development and testing (`3` also works, with the same limits).
        The key is in the URL, so treat v1 URLs as secrets and don't log them.
