  /api/v1/json/{apiKey}/eventstv.php:
    get:
      operationId: tvListings
      tags:
      - TV
      summary: TV listings
      description: |-
        Use one form: `d` (optionally with `s`, or `s` and `a`), `c`, or `id`. **`a` without `s` returns an empty body.** For an event's channels use `lookuptv.php`.

        Records measured 5 Oct 2026: free key **1**, premium key **287**.

        Documented limit: 1 / 1500 (free / premium).
      parameters:
      - $ref: '#/components/parameters/apiKey'
      - name: d
        in: query
        required: false
        description: A day, `YYYY-MM-DD`.
        schema:
          type: string
          format: date
        example: '2026-10-05'
      - name: s
        in: query
        required: false
        description: Sport name (with `d`).
        schema:
          type: string
        example: Ice_Hockey
      - name: a
        in: query
        required: false
        description: Country of the channel (with `d` **and** `s`).
        schema:
          type: string
        example: Canada
      - name: c
        in: query
        required: false
        description: Channel name (alone), e.g. `TSN_1`.
        schema:
          type: string
        example: TSN_1
      - name: id
        in: query
        required: false
        description: Channel id, `idChannel` (alone). **Not** an event id.
        schema:
          type: integer
        example: 8631
      responses:
        '200':
          description: The records under `tvevents`. An empty body also means no results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tvevents:
                    oneOf:
                    - type: array
                      items:
