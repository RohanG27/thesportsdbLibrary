components:
  schemas:
    Contract:
      type: object
      description: Contract record. Every value is a string or null; `""` also means no value.
      properties:
        id:
          type:
          - string
          - 'null'
          description: Id of this contract record.
          examples:
          - '112'
        idPlayer:
          type:
          - string
          - 'null'
          description: Player id.
          examples:
          - '34147178'
        idTeam:
          type:
          - string
          - 'null'
          description: Team id.
          examples:
          - '134281'
        strBadge:
          type:
          - string
          - 'null'
          description: Badge image URL.
          examples:
          - https://r2.thesportsdb.com/images/media/team/badge/yprvxx1473538097.png
        strPlayer:
          type:
          - string
          - 'null'
          description: Player name.
          examples:
          - Edenilson
        strSport:
          type:
          - string
          - 'null'
          description: Sport name, e.g. `Soccer`, `Ice Hockey`. Use this spelling for sport filters.
          examples:
          - Soccer
        strTeam:
          type:
          - string
          - 'null'
          description: Team name.
          examples:
          - Internacional
        strWage:
          type:
          - string
          - 'null'
          description: Wage, as text with currency, e.g. `£5,200,000`.
        strYearEnd:
          type:
          - string
          - 'null'
          description: Contract end year.
          examples:
          - '2021'
        strYearStart:
          type:
          - string
          - 'null'
          description: Contract start year.
          examples:
          - '2018'
    Country:
      type: object
      description: Country record. Every value is a string or null; `""` also means no value.
      properties:
        code:
          type:
          - string
          - 'null'
          description: Two-letter country code, e.g. `AD`.
          examples:
          - AD
        flag_url_16:
          type:
          - string
          - 'null'
          description: 16 px flag image URL.
          examples:
          - https://www.thesportsdb.com/images/icons/flags/shiny/16/Andorra.png
        flag_url_32:
          type:
          - string
          - 'null'
          description: 32 px flag image URL.
          examples:
          - https://www.thesportsdb.com/images/icons/flags/shiny/32/Andorra.png
        flag_url_64:
          type:
          - string
          - 'null'
          description: 64 px flag image URL.
          examples:
          - https://www.thesportsdb.com/images/icons/flags/shiny/64/Andorra.png
        idAPIfootball:
          type:
          - string
          - 'null'
          description: Id of the same record in API-Football.
          examples:
          - '13'
        name_en:
          type:
          - string
          - 'null'
          description: Country name in English. Use this spelling for country filters.
          examples:
          - Andorra
        name_fr:
          type:
          - string
          - 'null'
          description: Country name in French.
          examples:
          - Andorre
    Equipment:
      type: object
      description: Equipment record. Every value is a string or null; `""` also means no value.
      properties:
        date:
          type:
          - string
          - 'null'
          description: When the kit was added, `YYYY-MM-DD HH:MM:SS` (zone not stated).
          examples:
          - '2019-08-16 13:22:58'
        idEquipment:
          type:
          - string
          - 'null'
          description: Id of this kit record.
          examples:
          - '612'
        idTeam:
          type:
          - string
          - 'null'
          description: Id of the team the kit belongs to.
          examples:
          - '133597'
        strEquipment:
          type:
          - string
          - 'null'
          description: Kit image URL.
          examples:
          - https://r2.thesportsdb.com/images/media/team/equipment/2019-133597-Jersey.png
        strSeason:
          type:
          - string
          - 'null'
          description: Season name, e.g. `2026-2027`, or `2026` for single-year leagues.
          examples:
          - 2019-2020
        strType:
          type:
          - string
          - 'null'
          description: Kit type, e.g. `1st`, `2nd`, `GK`.
          examples:
          - 1st
        strUsername:
          type:
          - string
          - 'null'
          description: TheSportsDB user who uploaded the record.
          examples:
          - smudgie
    Event:
      type: object
      description: Event record. Every value is a string or null; `""` also means no value.
      properties:
        dateEvent:
          type:
          - string
          - 'null'
          description: Date of the event, `YYYY-MM-DD`, in **UTC**.
          examples:
          - '2014-12-29'
        dateEventLocal:
          type:
          - string
          - 'null'
          description: Date of the event at the venue, `YYYY-MM-DD`. Often missing for future events.
          examples:
          - '2014-12-29'
        idAPIfootball:
          type:
          - string
          - 'null'
          description: Id of the same record in API-Football.
        idAwayTeam:
          type:
          - string
          - 'null'
          description: Away team id.
          examples:
          - '133614'
        idEvent:
          type:
          - string
          - 'null'
          description: Event id.
          examples:
          - '441613'
        idHomeTeam:
          type:
          - string
          - 'null'
          description: Home team id.
          examples:
          - '133602'
        idLeague:
          type:
          - string
          - 'null'
          description: League id.
          examples:
          - '4328'
        idVenue:
          type:
          - string
          - 'null'
          description: Venue id.
          examples:
          - '15407'
        intAwayScore:
          type:
          - string
          - 'null'
          description: Away score. Null until the event has a score.
          examples:
          - '1'
        intAwayScoreExtra:
          type:
          - string
          - 'null'
          description: Away score in extra time or a shoot-out.
        intHomeScore:
          type:
