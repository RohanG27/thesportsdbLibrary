[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thesportsdb-client"
version = "0.1.0.dev0"
description = "Python client for TheSportsDB API v1 and v2: typed models, sync and async, rate limiting, caching."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "anyio", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/thesportsdb_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real API (run with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.mypy]
strict = true
files = ["src/thesportsdb_client"]

[tool.ruff]
line-length = 135
src = ["src", "tests"]
extend-exclude = ["src/thesportsdb_client/_sync"]  # generated from _async

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
